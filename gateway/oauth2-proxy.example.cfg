# DEVELOPMENT EXAMPLE ONLY. Do not expose this configuration until the issuer,
# restricted-client policy, TLS, proxy chain, and rollback have been tested.
provider = "oidc"
oidc_issuer_url = "https://auth.example.com"
client_id = "strata-preview"
client_secret_file = "/private/path/to/oidc-client-secret"
redirect_url = "https://strata-preview.example.com/oauth2/callback"
scope = "openid email"
email_domains = ["*"]
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
ssl_insecure_skip_verify = false

http_address = "127.0.0.1:23181"
upstreams = ["http://127.0.0.1:23180/"]
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]

cookie_name = "__Host-autbot_strata"
cookie_secret_file = "/private/path/to/32-byte-cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "15m"
cookie_refresh = "0"

# The gateway independently introspects the forwarded OAuth token; it never
# trusts the forwarded email header or injects a Strata key. Keep only this
# gateway reachable as the upstream and protect all other ingress paths.
pass_access_token = true
pass_basic_auth = false
pass_authorization_header = false
pass_user_headers = false
skip_auth_strip_headers = false
request_logging = false

# Machine clients retain Strata API-key access. The gateway checks upstream
# key enforcement before forwarding each API request. Other paths require OIDC.
skip_auth_routes = ["^/v1/", "GET=^/health$", "HEAD=^/health$", "GET=^/api/health$", "HEAD=^/api/health$"]
